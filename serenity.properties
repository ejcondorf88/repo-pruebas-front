# Configuración de Serenity BDD

# Nombre del proyecto
serenity.project.name=Serenity Screenplay Demo

# Navegador
webdriver.driver=chrome
webdriver.autodownload=true

# URL base - apunta al frontend Docker
webdriver.base.url=http://localhost/login

# Timeouts
webdriver.timeouts.implicitlywait=30000
webdriver.wait.for.timeout=45000

# Configuración de Chrome
chrome.preferences.download.default_directory=/tmp
chrome.preferences.download.prompt_for_download=false

# Capabilidades de Chrome
webdriver.capabilities.browserName=chrome
webdriver.capabilitiesgoog:chromeOptions.args=--no-sandbox,--disable-dev-shm-usage,--disable-blink-features=AutomationControlled

# Directorio de reportes
serenity.outputDirectory=target/site/serenity

# Opciones de ejecución
serenity.take.screenshots=FOR_EACH_ACTION
serenity.report.show.manual.tests=false
serenity.report.show.releases=false

# Root de tests
serenity.test.root=features
